<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="Inter,-apple-system,Segoe UI,sans-serif" role="img" aria-labelledby="t d">
<title id="t">How to read the gap between WooCommerce, GA4 and Meta</title>
<desc id="d">Illustrative example, not real data. Over the same 14 days a store has 100 paid WooCommerce orders, 82 GA4 purchases and 64 Meta-attributed purchases. The gap between WooCommerce and GA4 points to collection problems such as a missing thank-you page, blockers or caching. The gap between GA4 and Meta is partly expected, because not every buyer clicked or saw a Meta ad, and partly attribution, consent and matching.</desc>
<rect width="1200" height="600" fill="#f7f8fa"/>
<text x="48" y="56" font-size="22" font-weight="700" fill="#101721">Two gaps, two different problems</text>
<text x="48" y="84" font-size="15" fill="#626975">Illustrative example: one store, the same 14 days, counted three ways.</text>

<!-- axis: 0..100 -> y 500..160 (3.4px per unit) -->
<g stroke="#dce0e3"><line x1="120" y1="500" x2="760" y2="500"/><line x1="120" y1="330" x2="760" y2="330" stroke-dasharray="4 6"/><line x1="120" y1="160" x2="760" y2="160" stroke-dasharray="4 6"/></g>
<g font-size="13" fill="#626975" text-anchor="end"><text x="108" y="504">0</text><text x="108" y="334">50</text><text x="108" y="164">100</text></g>

<rect x="160" y="160" width="140" height="340" rx="8" fill="#101721"/>
<text x="230" y="148" text-anchor="middle" font-size="18" font-weight="700" fill="#101721">100</text>
<rect x="370" y="221" width="140" height="279" rx="8" fill="#5145cd"/>
<text x="440" y="209" text-anchor="middle" font-size="18" font-weight="700" fill="#101721">82</text>
<rect x="580" y="282" width="140" height="218" rx="8" fill="#8f87e0"/>
<text x="650" y="270" text-anchor="middle" font-size="18" font-weight="700" fill="#101721">64</text>

<g font-size="15" font-weight="600" fill="#101721" text-anchor="middle">
<text x="230" y="528">Paid orders</text><text x="230" y="548" font-size="13" font-weight="400" fill="#626975">WooCommerce</text>
<text x="440" y="528">Purchases</text><text x="440" y="548" font-size="13" font-weight="400" fill="#626975">GA4</text>
<text x="650" y="528">Purchases</text><text x="650" y="548" font-size="13" font-weight="400" fill="#626975">Meta Ads Manager</text>
</g>

<!-- gap brackets -->
<path d="M318 160 H340 V221 H352" fill="none" stroke="#b4232c" stroke-width="2.5"/>
<path d="M528 221 H550 V282 H562" fill="none" stroke="#e58a17" stroke-width="2.5"/>
<text x="322" y="198" font-size="15" font-weight="700" fill="#b4232c">A</text>
<text x="532" y="259" font-size="15" font-weight="700" fill="#e58a17">B</text>

<rect x="800" y="150" width="352" height="160" rx="14" fill="#fff" stroke="#dce0e3"/>
<rect x="800" y="150" width="8" height="160" rx="4" fill="#b4232c"/>
<text x="828" y="184" font-size="17" font-weight="700" fill="#101721">Gap A: orders → GA4</text>
<text x="828" y="210" font-size="14" fill="#626975">Mostly collection. The purchase</text>
<text x="828" y="230" font-size="14" fill="#626975">never fired or fired empty.</text>
<text x="828" y="258" font-size="14" fill="#101721">Look at: thank-you page, gateways,</text>
<text x="828" y="278" font-size="14" fill="#101721">caching, blockers, consent.</text>

<rect x="800" y="330" width="352" height="170" rx="14" fill="#fff" stroke="#dce0e3"/>
<rect x="800" y="330" width="8" height="170" rx="4" fill="#e58a17"/>
<text x="828" y="364" font-size="17" font-weight="700" fill="#101721">Gap B: GA4 → Meta</text>
<text x="828" y="390" font-size="14" fill="#626975">Partly expected: not every buyer</text>
<text x="828" y="410" font-size="14" fill="#626975">clicked or saw a Meta ad.</text>
<text x="828" y="438" font-size="14" fill="#101721">Look at: attribution window,</text>
<text x="828" y="458" font-size="14" fill="#101721">CAPI, match quality, dedup.</text>

<text x="48" y="586" font-size="13" fill="#9aa1ab">Illustrative numbers, not real store data or a benchmark. Your own gap depends on traffic, consent rates and channel mix.</text>
</svg>
