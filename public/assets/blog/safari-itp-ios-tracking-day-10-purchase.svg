<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="Inter,-apple-system,Segoe UI,sans-serif" role="img" aria-labelledby="t d">
<title id="t">A Safari shopper who buys on day 10</title>
<desc id="d">Illustrative scenario. A Safari visitor clicks an ad on day 0 and buys on day 10. Browser-only: the click ID is stored in a cookie written by JavaScript, which Safari caps at 7 days, or 1 day after some clicks, so by day 10 the purchase can't be tied to the click. Server-side with consent: a server-set cookie on your own infrastructure can still hold the identifier, and the server purchase event carries consented hashed email, fbp and fbc where available, and the order ID, so the ad platform has a better chance to match it.</desc>
<rect width="1200" height="600" fill="#f7f8fa"/>
<text x="48" y="56" font-size="22" font-weight="700" fill="#101721">A Safari shopper who buys on day 10</text>
<text x="48" y="84" font-size="15" fill="#626975">Illustrative scenario. Same click, same order, two setups.</text>
<!-- axis 0..14 days -> x 300..1120 (58.57 px/day) -->
<g stroke="#dce0e3"><line x1="300" y1="150" x2="300" y2="500"/><line x1="710" y1="150" x2="710" y2="500"/><line x1="886" y1="150" x2="886" y2="500"/><line x1="1120" y1="150" x2="1120" y2="500"/></g>
<rect x="244" y="112" width="112" height="30" rx="8" fill="#5145cd"/><text x="300" y="132" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Day 0: ad click</text>
<rect x="822" y="112" width="128" height="30" rx="8" fill="#101721"/><text x="886" y="132" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Day 10: purchase</text>
<!-- row A -->
<text x="48" y="206" font-size="16" font-weight="700" fill="#101721">Browser-only</text>
<text x="48" y="230" font-size="13" fill="#626975">click ID in a JavaScript cookie</text>
<rect x="300" y="186" width="410" height="40" rx="6" fill="#e58a17"/>
<text x="316" y="212" font-size="14" font-weight="700" fill="#101721">Cookie lives up to 7 days</text>
<rect x="300" y="236" width="59" height="20" rx="4" fill="#b4232c"/>
<text x="370" y="251" font-size="13" fill="#b4232c">or 1 day after some clicks</text>
<circle cx="886" cy="206" r="24" fill="#fde8e8" stroke="#e8a3a3"/>
<path d="M876 196l20 20M896 196l-20 20" stroke="#b4232c" stroke-width="4" stroke-linecap="round"/>
<text x="920" y="200" font-size="14" font-weight="700" fill="#b4232c">Can't be tied to</text>
<text x="920" y="220" font-size="14" font-weight="700" fill="#b4232c">the ad click</text>
<line x1="48" y1="296" x2="1152" y2="296" stroke="#dce0e3"/>
<!-- row B -->
<text x="48" y="356" font-size="16" font-weight="700" fill="#101721">Server-side, with consent</text>
<text x="48" y="380" font-size="13" fill="#626975">server-set cookie + server event</text>
<rect x="300" y="336" width="820" height="40" rx="6" fill="#5fa83a"/>
<text x="316" y="362" font-size="14" font-weight="700" fill="#fff">Server-set cookie on your own infrastructure keeps the ID</text>
<circle cx="886" cy="430" r="24" fill="#e7f6d2" stroke="#a9d36b"/>
<path d="M875 431l8 8l15 -17" stroke="#395e33" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="300" y="400" width="548" height="64" rx="12" fill="#fff" stroke="#dce0e3"/>
<text x="318" y="427" font-size="14" font-weight="600" fill="#101721">Purchase sent from the server with order ID,</text>
<text x="318" y="449" font-size="14" fill="#626975">consented hashed email, fbp and fbc where available</text>
<text x="920" y="424" font-size="14" font-weight="700" fill="#395e33">Platform has a better</text>
<text x="920" y="444" font-size="14" font-weight="700" fill="#395e33">chance to match it</text>
<g font-size="13" fill="#626975"><text x="300" y="524" text-anchor="middle">0</text><text x="710" y="524" text-anchor="middle">7</text><text x="886" y="524" text-anchor="middle">10</text><text x="1120" y="524" text-anchor="middle">14 days</text></g>
<text x="48" y="562" font-size="13" fill="#626975">Not a guarantee: Safari can still cap server-set cookies at 7 days when the tracking subdomain is cloaked to a third party.</text>
<text x="48" y="584" font-size="13" fill="#9aa1ab">Sources: WebKit ITP 2.1 and 2.2, tracking prevention policy, Private Browsing 2.0; Meta Conversions API docs.</text>
</svg>
