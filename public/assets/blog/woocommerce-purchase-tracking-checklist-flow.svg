<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Inter,-apple-system,Segoe UI,sans-serif" role="img" aria-labelledby="t d">
<title id="t">Find where a WooCommerce order stopped being tracked</title>
<desc id="d">A diagnostic flow for one missing order. First check that WooCommerce shows the order as paid; if not, it is not a tracking problem yet. Then check whether a purchase event appeared in the data layer or GTM Preview; if not, look at the thank-you page, gateway return, caching and plugins. Then check whether the server container received it; if not, check the tracking domain, consent and blockers. Then check whether the platform received it; if not, check the tag setup, credentials and destination errors. If it did, the remaining gap is attribution or deduplication.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#626975"/></marker></defs>
<rect width="1200" height="760" fill="#f7f8fa"/>
<text x="600" y="54" text-anchor="middle" font-size="24" font-weight="700" fill="#101721">Where did this order stop?</text>
<text x="600" y="82" text-anchor="middle" font-size="15" fill="#626975">Follow one missing order from top to bottom. Stop at the first "no".</text>

<g font-size="17" font-weight="600" fill="#101721" text-anchor="middle">
<rect x="380" y="108" width="440" height="80" rx="14" fill="#fff" stroke="#5145cd" stroke-width="2"/>
<text x="600" y="142">Is the order paid in WooCommerce?</text>
<text x="600" y="168" font-size="14" font-weight="400" fill="#626975">Processing or Completed, not Pending or On hold</text>
<rect x="380" y="248" width="440" height="80" rx="14" fill="#fff" stroke="#5145cd" stroke-width="2"/>
<text x="600" y="282">Did a purchase event fire once?</text>
<text x="600" y="308" font-size="14" font-weight="400" fill="#626975">GTM Preview or dataLayer: ID, value, currency</text>
<rect x="380" y="388" width="440" height="80" rx="14" fill="#fff" stroke="#5145cd" stroke-width="2"/>
<text x="600" y="422">Did your server container receive it?</text>
<text x="600" y="448" font-size="14" font-weight="400" fill="#626975">Server preview, event log, Purchase Inspector</text>
<rect x="380" y="528" width="440" height="80" rx="14" fill="#fff" stroke="#5145cd" stroke-width="2"/>
<text x="600" y="562">Did the platform accept it?</text>
<text x="600" y="588" font-size="14" font-weight="400" fill="#626975">GA4 DebugView, Meta Test Events, diagnostics</text>
</g>
<g stroke="#626975" stroke-width="2.5" fill="none">
<line x1="600" y1="188" x2="600" y2="242" marker-end="url(#a)"/><line x1="600" y1="328" x2="600" y2="382" marker-end="url(#a)"/><line x1="600" y1="468" x2="600" y2="522" marker-end="url(#a)"/><line x1="600" y1="608" x2="600" y2="642" marker-end="url(#a)"/>
<line x1="380" y1="148" x2="326" y2="148" marker-end="url(#a)"/><line x1="820" y1="288" x2="874" y2="288" marker-end="url(#a)"/><line x1="380" y1="428" x2="326" y2="428" marker-end="url(#a)"/><line x1="820" y1="568" x2="874" y2="568" marker-end="url(#a)"/>
</g>
<g font-size="14" font-weight="700" fill="#626975">
<text x="612" y="222">YES</text><text x="612" y="362">YES</text><text x="612" y="502">YES</text><text x="612" y="632">YES</text>
<text x="338" y="136">NO</text><text x="834" y="276">NO</text><text x="338" y="416">NO</text><text x="834" y="556">NO</text>
</g>

<rect x="48" y="108" width="272" height="80" rx="14" fill="#eceef2"/><text x="68" y="140" font-size="16" font-weight="700" fill="#101721">Not a tracking gap yet</text><text x="68" y="164" font-size="14" fill="#626975">Unpaid orders shouldn't count</text>
<rect x="880" y="236" width="272" height="104" rx="14" fill="#fde8e8"/><text x="900" y="266" font-size="16" font-weight="700" fill="#101721">Browser side</text><text x="900" y="290" font-size="14" fill="#626975">Thank-you page, gateway return,</text><text x="900" y="310" font-size="14" fill="#626975">caching, block checkout, plugins</text>
<rect x="48" y="376" width="272" height="104" rx="14" fill="#fde8e8"/><text x="68" y="406" font-size="16" font-weight="700" fill="#101721">Delivery</text><text x="68" y="430" font-size="14" fill="#626975">Tracking domain, DNS, consent,</text><text x="68" y="450" font-size="14" fill="#626975">blockers, container not published</text>
<rect x="880" y="516" width="272" height="104" rx="14" fill="#fde8e8"/><text x="900" y="546" font-size="16" font-weight="700" fill="#101721">Destination</text><text x="900" y="570" font-size="14" fill="#626975">Tag trigger, IDs, API secret or</text><text x="900" y="590" font-size="14" fill="#626975">token, rejected parameters</text>

<rect x="380" y="648" width="440" height="72" rx="14" fill="#c5eb8c"/>
<text x="600" y="678" text-anchor="middle" font-size="16" font-weight="700" fill="#1a3123">Tracking worked. Check attribution</text>
<text x="600" y="702" text-anchor="middle" font-size="14" fill="#395e33">windows, ad clicks and deduplication</text>
<text x="600" y="746" text-anchor="middle" font-size="13" fill="#626975">Use the order number, not the amount, to find the same order at every step.</text>
</svg>
