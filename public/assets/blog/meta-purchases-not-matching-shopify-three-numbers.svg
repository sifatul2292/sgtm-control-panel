<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Inter,-apple-system,Segoe UI,sans-serif" role="img" aria-labelledby="t d">
<title id="t">Three numbers: Shopify orders, Meta events received, Meta purchases credited to ads</title>
<desc id="d">Illustrative funnel for one week. Shopify shows 120 orders across all sales channels, 104 of them from the Online Store. Meta Events Manager received about 98 Purchase events from each connection method. Meta Ads Manager credits 61 purchases to ads, 52 through link clicks and 9 through views or engagement. Labels between the bars explain each gap: orders from other sales channels, events that never reached Meta, and sales Meta doesn't credit to an ad.</desc>
<rect width="1200" height="640" fill="#f7f8fa"/>
<text x="48" y="56" font-size="22" font-weight="700" fill="#101721">Three counters, not two</text>
<text x="48" y="84" font-size="15" fill="#626975">One illustrative week. Each step down has its own reason, and only one of them is a tracking problem.</text>

<g font-size="15">
<!-- Bar 1 -->
<text x="48" y="140" font-weight="700" fill="#101721">Shopify · all orders</text>
<text x="48" y="162" font-size="14" fill="#626975">Analytics, every sales channel</text>
<rect x="330" y="122" width="720" height="44" rx="10" fill="#eceef2"/>
<text x="1066" y="152" font-size="22" font-weight="700" fill="#101721">120</text>

<text x="330" y="196" font-size="14" fill="#626975">− POS, draft orders marked paid, subscription renewals, other channels</text>

<!-- Bar 2 -->
<text x="48" y="238" font-weight="700" fill="#101721">Shopify · Online Store</text>
<text x="48" y="260" font-size="14" fill="#626975">Orders that went through checkout</text>
<rect x="330" y="220" width="624" height="44" rx="10" fill="#eceaff"/>
<text x="970" y="250" font-size="22" font-weight="700" fill="#5145cd">104</text>

<rect x="330" y="278" width="700" height="34" rx="8" fill="#fde8e8"/>
<text x="346" y="300" font-size="14" font-weight="600" fill="#b4232c">Tracking gap: blocked Pixel, paused app pixel, old script, page never loaded, declined consent</text>

<!-- Bar 3 -->
<text x="48" y="352" font-weight="700" fill="#101721">Events Manager · received</text>
<text x="48" y="374" font-size="14" fill="#626975">Per connection method, all visitors</text>
<rect x="330" y="334" width="588" height="44" rx="10" fill="#c5eb8c"/>
<text x="934" y="364" font-size="22" font-weight="700" fill="#1a3123">≈98</text>

<text x="330" y="408" font-size="14" fill="#626975">− orders not from Meta ads, outside the attribution window, or not matched to a person</text>

<!-- Bar 4 -->
<text x="48" y="450" font-weight="700" fill="#101721">Ads Manager · results</text>
<text x="48" y="472" font-size="14" fill="#626975">Purchases credited to ads</text>
<rect x="330" y="432" width="312" height="44" rx="10" fill="#5145cd"/>
<rect x="642" y="432" width="54" height="44" rx="0" fill="#9b93e8"/>
<rect x="686" y="432" width="10" height="44" rx="0" fill="#9b93e8"/>
<text x="712" y="462" font-size="22" font-weight="700" fill="#101721">61</text>
<text x="346" y="460" font-size="14" font-weight="600" fill="#fff">52 link clicks</text>
<text x="330" y="500" font-size="14" fill="#626975"><tspan fill="#5145cd" font-weight="700">■</tspan> 7-day click  <tspan fill="#9b93e8" font-weight="700">■</tspan> 9 from 1-day view or engage-through</text>
</g>

<line x1="48" y1="532" x2="1152" y2="532" stroke="#dce0e3"/>
<g font-size="15">
<rect x="48" y="552" width="530" height="48" rx="12" fill="#fff" stroke="#dce0e3"/>
<text x="68" y="582" fill="#101721"><tspan font-weight="700">Online Store vs Events Manager</tspan> = tracking</text>
<rect x="622" y="552" width="530" height="48" rx="12" fill="#fff" stroke="#dce0e3"/>
<text x="642" y="582" fill="#101721"><tspan font-weight="700">Shopify vs Ads Manager</tspan> = attribution</text>
</g>
<text x="48" y="626" font-size="13" fill="#9aa1ab">Numbers are illustrative. Events Manager's headline total counts events before deduplication; compare one connection method at a time.</text>
</svg>
