<rect x="48" y="436" width="84" height="24" rx="12" fill="#eceef2"/><text x="90" y="452" text-anchor="middle" font-size="13" font-weight="700" fill="#5145cd">MANAGED</text>
<text x="146" y="453" fill="#626975">A managed sGTM host usually takes care of this step for you.</text>
<rect x="48" y="470" width="84" height="24" rx="12" fill="#e6f4ea"/><text x="90" y="486" text-anchor="middle" font-size="13" font-weight="700" fill="#395e33">FILES</text>
<text x="146" y="487" fill="#626975">Pre-built, importable container files (such as Tagioo's Setup Assistant) can cover this step. You still review, preview and publish.</text>
</g>
