<rect x="894" y="164" width="258" height="112" rx="14"/><rect x="894" y="292" width="258" height="112" rx="14"/>
</g>
<g font-size="15" font-weight="700" fill="#5145cd">
<text x="68" y="194">STEP 1</text><text x="68" y="322">STEP 2</text><text x="350" y="194">STEP 3</text><text x="350" y="322">STEP 4</text>
</g>
<g font-size="15" font-weight="700" fill="#395e33"><text x="632" y="194">STEP 5</text><text x="632" y="322">STEP 6</text></g>
<g font-size="15" font-weight="700" fill="#101721"><text x="914" y="194">STEP 7</text><text x="914" y="322">STEP 8</text></g>
<g font-size="17" font-weight="700" fill="#101721">
<text x="68" y="222">Create server container</text><text x="68" y="350">Host the container</text>
<text x="350" y="222">Subdomain, DNS, SSL</text><text x="350" y="350">Point the web container</text>
<text x="632" y="222">GA4 client + GA4 tag</text><text x="632" y="350">Meta, TikTok, Google Ads</text>
<text x="914" y="222">Preview and debug</text><text x="914" y="350">Publish and verify</text>
</g>
<g font-size="14" fill="#626975">
<text x="68" y="248">Copy the Container Config</text><text x="68" y="376">Cloud Run, Docker or managed</text>
<text x="350" y="248">e.g. track.yourstore.com</text><text x="350" y="376">server_container_url</text>
<text x="632" y="248">Trigger: Client Name = GA4</text><text x="632" y="376">event_id, consent checks</text>
<text x="914" y="248">Both debuggers, a test order</text><text x="914" y="376">Both containers, real order</text>
</g>
<g font-size="13" font-weight="700">
