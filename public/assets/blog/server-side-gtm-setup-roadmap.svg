<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="Inter,-apple-system,Segoe UI,sans-serif" role="img" aria-labelledby="t d">
<title id="t">Server-side GTM setup in 8 steps</title>
<desc id="d">Eight setup steps grouped into four phases. Build: 1 create the server container, 2 host it. Connect: 3 add a tracking subdomain with DNS and SSL, 4 point the web container's Google tag at it. Forward: 5 GA4 client and GA4 tag, 6 Meta CAPI, TikTok and Google Ads tags. Verify: 7 preview and debug, 8 publish both containers and verify with a real order. Badges show which steps a managed host usually handles (2 and 3) and which pre-built container files can cover (4 to 6).</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#626975"/></marker></defs>
<rect width="1200" height="520" fill="#f7f8fa"/>
<text x="48" y="56" font-size="22" font-weight="700" fill="#101721">Server-side GTM setup at a glance</text>
<text x="48" y="84" font-size="15" fill="#626975">Eight steps in four phases. Most failed setups break in Connect or Verify.</text>
<g font-size="13" font-weight="700" letter-spacing="1.5" fill="#fff">
<rect x="48" y="112" width="258" height="36" rx="10" fill="#5145cd"/><text x="68" y="136">1 · BUILD</text>
<rect x="330" y="112" width="258" height="36" rx="10" fill="#5145cd"/><text x="350" y="136">2 · CONNECT</text>
<rect x="612" y="112" width="258" height="36" rx="10" fill="#395e33"/><text x="632" y="136">3 · FORWARD</text>
<rect x="894" y="112" width="258" height="36" rx="10" fill="#101721"/><text x="914" y="136">4 · VERIFY</text>
</g>
<g fill="#fff" stroke="#dce0e3">
