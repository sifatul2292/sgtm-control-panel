<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" font-family="Inter,-apple-system,Segoe UI,sans-serif" role="img" aria-labelledby="t d">
<title id="t">Which WooCommerce setup survives which problem?</title>
<desc id="d">Comparison of three setups for the purchase event. Browser-only tracking loses the purchase when an ad blocker blocks the tag, the shopper closes the tab before the thank-you page, the gateway redirect fails, or the thank-you page is cached or broken, and Safari caps its JavaScript cookies at 7 days. Server GTM that only relays browser events still loses purchases whose thank-you page never ran, but uses server-set cookies and can load tags first-party. Server GTM plus a backend purchase hit can still record those purchases. Declined consent should stop sending in every setup.</desc>
<rect width="1200" height="660" fill="#f7f8fa"/>
<text x="48" y="56" font-size="22" font-weight="700" fill="#101721">Which setup still records the purchase?</text>
<text x="48" y="84" font-size="15" fill="#626975">Server GTM on its own only relays what the browser sends. The backend hit is what covers a missing thank-you page.</text>

<!-- header -->
<rect x="48" y="112" width="1104" height="62" rx="12" fill="#fff" stroke="#dce0e3"/>
<g font-size="15" font-weight="700" fill="#101721">
<text x="72" y="149">What goes wrong</text>
<text x="600" y="140" text-anchor="middle">Browser-only</text><text x="600" y="160" text-anchor="middle" font-size="13" font-weight="400" fill="#626975">pixel + GA4 tag</text>
<text x="800" y="140" text-anchor="middle">Server GTM relay</text><text x="800" y="160" text-anchor="middle" font-size="13" font-weight="400" fill="#626975">browser → your subdomain</text>
<text x="1020" y="140" text-anchor="middle">+ Backend purchase hit</text><text x="1020" y="160" text-anchor="middle" font-size="13" font-weight="400" fill="#626975">sent on payment</text>
</g>

<g font-size="15" fill="#101721">
<text x="72" y="216">Ad blocker blocks googletagmanager.com</text>
<text x="72" y="282">Shopper closes the tab before the thank-you page</text>
<text x="72" y="348">Payment gateway never redirects back</text>
<text x="72" y="414">Thank-you page cached, custom or broken</text>
<text x="72" y="480">Safari caps JavaScript cookies at 7 days</text>
<text x="72" y="546">Shopper declines marketing consent</text>
</g>
<g stroke="#dce0e3"><line x1="48" y1="244" x2="1152" y2="244"/><line x1="48" y1="310" x2="1152" y2="310"/><line x1="48" y1="376" x2="1152" y2="376"/><line x1="48" y1="442" x2="1152" y2="442"/><line x1="48" y1="508" x2="1152" y2="508"/><line x1="48" y1="574" x2="1152" y2="574"/></g>

<!-- pills: red = lost, amber = partly, green = recorded, grey = not sent -->
<g font-size="14" font-weight="700" text-anchor="middle">
<!-- row1 -->
<rect x="530" y="194" width="140" height="32" rx="16" fill="#fde8e8"/><text x="600" y="215" fill="#b4232c">Lost</text>
<rect x="715" y="194" width="170" height="32" rx="16" fill="#fdf0d9"/><text x="800" y="215" fill="#8a5300">Partly*</text>
<rect x="935" y="194" width="170" height="32" rx="16" fill="#c5eb8c"/><text x="1020" y="215" fill="#395e33">Purchase recorded</text>
<!-- row2 -->
<rect x="530" y="260" width="140" height="32" rx="16" fill="#fde8e8"/><text x="600" y="281" fill="#b4232c">Lost</text>
<rect x="715" y="260" width="170" height="32" rx="16" fill="#fde8e8"/><text x="800" y="281" fill="#b4232c">Lost</text>
<rect x="935" y="260" width="170" height="32" rx="16" fill="#c5eb8c"/><text x="1020" y="281" fill="#395e33">Purchase recorded</text>
<!-- row3 -->
<rect x="530" y="326" width="140" height="32" rx="16" fill="#fde8e8"/><text x="600" y="347" fill="#b4232c">Lost</text>
<rect x="715" y="326" width="170" height="32" rx="16" fill="#fde8e8"/><text x="800" y="347" fill="#b4232c">Lost</text>
<rect x="935" y="326" width="170" height="32" rx="16" fill="#c5eb8c"/><text x="1020" y="347" fill="#395e33">Purchase recorded</text>
<!-- row4 -->
<rect x="530" y="392" width="140" height="32" rx="16" fill="#fde8e8"/><text x="600" y="413" fill="#b4232c">Lost or wrong</text>
<rect x="715" y="392" width="170" height="32" rx="16" fill="#fde8e8"/><text x="800" y="413" fill="#b4232c">Lost or wrong</text>
<rect x="935" y="392" width="170" height="32" rx="16" fill="#c5eb8c"/><text x="1020" y="413" fill="#395e33">Purchase recorded</text>
<!-- row5 -->
<rect x="530" y="458" width="140" height="32" rx="16" fill="#fdf0d9"/><text x="600" y="479" fill="#8a5300">Shorter memory</text>
<rect x="715" y="458" width="170" height="32" rx="16" fill="#c5eb8c"/><text x="800" y="479" fill="#395e33">Server-set cookies†</text>
<rect x="935" y="458" width="170" height="32" rx="16" fill="#c5eb8c"/><text x="1020" y="479" fill="#395e33">Server-set cookies†</text>
<!-- row6 -->
<rect x="515" y="524" width="610" height="32" rx="16" fill="#eceef2"/><text x="820" y="545" fill="#626975">Your consent rules decide what is sent, in every setup</text>
</g>

<text x="48" y="606" font-size="13" fill="#626975">*Only if gtm.js is also served from your own domain (for example a custom loader); some tools block first-party endpoints too.</text>
<text x="48" y="628" font-size="13" fill="#626975">†Safari can still cap them at 7 days if the tracking subdomain resolves to a different IP range than your site (WebKit CNAME defense).</text>
<text x="48" y="650" font-size="13" fill="#9aa1ab">Illustrative comparison based on how each setup works, not measured results. Sources: WebKit ITP 2.1 and CNAME-cloaking posts.</text>
</svg>
