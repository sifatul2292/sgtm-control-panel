<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="Inter,-apple-system,Segoe UI,sans-serif" role="img" aria-labelledby="t d">
<title id="t">The hosting bill is only the tip of the cost</title>
<desc id="d">Illustration of an iceberg. Above the waterline: the monthly hosting bill. Below the waterline: setup time (containers, DNS, event mapping, consent, testing), maintenance (image updates, scaling, template changes), monitoring (noticing when events stop or tokens expire), cloud extras (logging, load balancer, network) and outside help (agency or consultant fees). Not to scale.</desc>
<rect width="1200" height="600" fill="#f7f8fa"/>
<text x="48" y="56" font-size="22" font-weight="700" fill="#101721">What server-side tagging really costs</text>
<text x="48" y="84" font-size="15" fill="#626975">The hosting bill is the part you see. Most of the cost sits below the waterline. Illustration, not to scale.</text>
<rect x="0" y="210" width="1200" height="390" fill="#e8ecf8"/>
<line x1="0" y1="210" x2="1200" y2="210" stroke="#5145cd" stroke-width="2" stroke-dasharray="10 8"/>
<text x="1152" y="232" text-anchor="end" font-size="13" font-weight="700" letter-spacing="1.5" fill="#5145cd">WATERLINE</text>
<path d="M520 210 L560 130 L600 112 L650 136 L690 210 Z" fill="#fff" stroke="#dce0e3" stroke-width="2"/>
<path d="M520 210 L690 210 L780 300 L840 420 L760 540 L600 570 L440 520 L380 400 L430 290 Z" fill="#fff" stroke="#c9cff0" stroke-width="2"/>
<rect x="760" y="122" width="300" height="64" rx="12" fill="#fff" stroke="#dce0e3"/>
<text x="780" y="150" font-size="17" font-weight="700" fill="#101721">Hosting bill</text>
<text x="780" y="172" font-size="14" fill="#626975">Cloud Run or a managed plan</text>
<line x1="756" y1="154" x2="660" y2="160" stroke="#626975" stroke-width="2"/>
<g font-size="16" font-weight="700" fill="#101721">
<rect x="48" y="262" width="320" height="78" rx="12" fill="#fff" stroke="#dce0e3"/><text x="68" y="292">Setup time</text>
<rect x="48" y="360" width="320" height="78" rx="12" fill="#fff" stroke="#dce0e3"/><text x="68" y="390">Maintenance</text>
<rect x="48" y="458" width="320" height="78" rx="12" fill="#fff" stroke="#dce0e3"/><text x="68" y="488">Monitoring</text>
<rect x="852" y="300" width="300" height="78" rx="12" fill="#fff" stroke="#dce0e3"/><text x="872" y="330">Cloud extras</text>
<rect x="852" y="398" width="300" height="78" rx="12" fill="#fff" stroke="#dce0e3"/><text x="872" y="428">Outside help</text>
</g>
<g font-size="14" fill="#626975">
<text x="68" y="316">Containers, DNS, mapping, consent, tests</text>
<text x="68" y="414">Image updates, scaling, template changes</text>
<text x="68" y="512">Noticing when events stop or tokens expire</text>
<text x="872" y="354">Logging, load balancer, network</text>
<text x="872" y="452">Agency or consultant fees</text>
</g>
<g stroke="#9aa1ab" stroke-width="1.5"><line x1="372" y1="300" x2="440" y2="320"/><line x1="372" y1="398" x2="400" y2="400"/><line x1="372" y1="496" x2="430" y2="500"/><line x1="848" y1="338" x2="790" y2="320"/><line x1="848" y1="436" x2="830" y2="436"/></g>
<text x="600" y="400" text-anchor="middle" font-size="15" font-weight="600" fill="#5145cd">people + time</text>
<text x="48" y="586" font-size="13" fill="#626975">A managed host moves infrastructure, scaling and SSL off your list. Setup checks, monitoring and event quality stay with you.</text>
</svg>
