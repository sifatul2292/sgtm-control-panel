<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="Inter,-apple-system,Segoe UI,sans-serif" role="img" aria-labelledby="t d">
<title id="t">Two weekly ratios that tell tracking problems apart from weaker ads</title>
<desc id="d">Illustrative line chart over ten weeks. Coverage, the share of Shopify Online Store orders that reached Meta, holds near 0.95. Attribution share, Ads Manager purchases divided by Shopify orders, holds near 0.6. In week 7, after a theme change, both lines drop sharply, coverage to 0.55 and attribution share to 0.35, which points to a tracking problem rather than weaker ads.</desc>
<rect width="1200" height="600" fill="#f7f8fa"/>
<text x="48" y="56" font-size="22" font-weight="700" fill="#101721">Watch the ratios, not the gap</text>
<text x="48" y="84" font-size="15" fill="#626975">Both lines falling in the same week points to tracking. Only attribution share falling points to the ads.</text>

<!-- legend -->
<g font-size="14">
<line x1="48" y1="124" x2="80" y2="124" stroke="#2f7d32" stroke-width="4"/>
<text x="90" y="129" fill="#101721"><tspan font-weight="700">Coverage</tspan> · events received ÷ Online Store orders</text>
<line x1="520" y1="124" x2="552" y2="124" stroke="#5145cd" stroke-width="4"/>
<text x="562" y="129" fill="#101721"><tspan font-weight="700">Attribution share</tspan> · Ads Manager purchases ÷ Online Store orders</text>
</g>

<!-- axes: plot x 120..1120, y 160 (1.0) .. 500 (0) -->
<g font-size="13" fill="#626975" text-anchor="end">
<text x="104" y="165">1.0</text>
<text x="104" y="250">0.75</text>
<text x="104" y="335">0.5</text>
<text x="104" y="420">0.25</text>
<text x="104" y="505">0</text>
</g>
<g stroke="#dce0e3"><line x1="120" y1="160" x2="1120" y2="160"/><line x1="120" y1="245" x2="1120" y2="245"/><line x1="120" y1="330" x2="1120" y2="330"/><line x1="120" y1="415" x2="1120" y2="415"/></g>
<line x1="120" y1="500" x2="1120" y2="500" stroke="#626975"/>
<g font-size="13" fill="#626975" text-anchor="middle">
<text x="170" y="524">W1</text><text x="270" y="524">W2</text><text x="370" y="524">W3</text><text x="470" y="524">W4</text><text x="570" y="524">W5</text><text x="670" y="524">W6</text><text x="770" y="524">W7</text><text x="870" y="524">W8</text><text x="970" y="524">W9</text><text x="1070" y="524">W10</text>
</g>

<!-- change marker between W6 and W7 -->
<rect x="722" y="160" width="96" height="340" fill="#fde8e8" opacity="0.7"/>
<text x="770" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#b4232c">Theme change</text>

<!-- coverage: 0.95,0.96,0.94,0.95,0.96,0.95,0.55,0.56,0.54,0.55 ; y = 500 - v*340 -->
<polyline fill="none" stroke="#2f7d32" stroke-width="4" stroke-linejoin="round" points="170,177 270,174 370,180 470,177 570,174 670,177 770,313 870,310 970,316 1070,313"/>
<g fill="#2f7d32"><circle cx="170" cy="177" r="5"/><circle cx="270" cy="174" r="5"/><circle cx="370" cy="180" r="5"/><circle cx="470" cy="177" r="5"/><circle cx="570" cy="174" r="5"/><circle cx="670" cy="177" r="5"/><circle cx="770" cy="313" r="5"/><circle cx="870" cy="310" r="5"/><circle cx="970" cy="316" r="5"/><circle cx="1070" cy="313" r="5"/></g>
<text x="1080" y="300" font-size="14" font-weight="700" fill="#2f7d32" text-anchor="end">0.55</text>
<text x="180" y="200" font-size="14" font-weight="700" fill="#2f7d32">0.95</text>

<!-- attribution: 0.60,0.62,0.58,0.61,0.59,0.60,0.35,0.36,0.34,0.35 -->
<polyline fill="none" stroke="#5145cd" stroke-width="4" stroke-linejoin="round" points="170,296 270,289 370,303 470,293 570,299 670,296 770,381 870,378 970,384 1070,381"/>
<g fill="#5145cd"><circle cx="170" cy="296" r="5"/><circle cx="270" cy="289" r="5"/><circle cx="370" cy="303" r="5"/><circle cx="470" cy="293" r="5"/><circle cx="570" cy="299" r="5"/><circle cx="670" cy="296" r="5"/><circle cx="770" cy="381" r="5"/><circle cx="870" cy="378" r="5"/><circle cx="970" cy="384" r="5"/><circle cx="1070" cy="381" r="5"/></g>
<text x="1080" y="410" font-size="14" font-weight="700" fill="#5145cd" text-anchor="end">0.35</text>
<text x="180" y="326" font-size="14" font-weight="700" fill="#5145cd">0.60</text>

<text x="48" y="566" font-size="14" fill="#626975"><tspan font-weight="700" fill="#101721">Read it:</tspan> both lines drop in week 7, so purchases stopped reaching Meta. Fix the tracking before judging the campaigns.</text>
<text x="48" y="590" font-size="13" fill="#9aa1ab">Illustrative data, not from a real store.</text>
</svg>
