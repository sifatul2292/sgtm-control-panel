<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Inter,-apple-system,Segoe UI,sans-serif" role="img" aria-labelledby="t d">
<title id="t">Switching sGTM hosts without a tracking gap</title>
<desc id="d">Illustrative migration timeline. The old host stays live the whole time. The new host is set up on a second subdomain, tested in parallel, then becomes live at cutover. After cutover you compare counts with real orders, and only then cancel the old plan and remove any duplicate GTM snippet.</desc>
<rect width="1200" height="560" fill="#f7f8fa"/>
<text x="48" y="56" font-size="24" font-weight="700" fill="#101721">Switching sGTM hosts without a tracking gap</text>
<text x="48" y="86" font-size="15" fill="#626975">Run both hosts side by side. Only switch off the old one once the new numbers line up.</text>
<line x1="250" y1="140" x2="1090" y2="140" stroke="#c9cdf5" stroke-width="3"/>
<g font-size="14" font-weight="700" fill="#101721" text-anchor="middle">
<circle cx="250" cy="140" r="17" fill="#5145cd"/><text x="250" y="145" fill="#fff">1</text>
<circle cx="420" cy="140" r="17" fill="#5145cd"/><text x="420" y="145" fill="#fff">2</text>
<circle cx="590" cy="140" r="17" fill="#5145cd"/><text x="590" y="145" fill="#fff">3</text>
<circle cx="760" cy="140" r="17" fill="#5145cd"/><text x="760" y="145" fill="#fff">4</text>
<circle cx="925" cy="140" r="17" fill="#5145cd"/><text x="925" y="145" fill="#fff">5</text>
<circle cx="1090" cy="140" r="17" fill="#5145cd"/><text x="1090" y="145" fill="#fff">6</text>
</g>
<g font-size="15" font-weight="700" fill="#101721" text-anchor="middle">
<text x="250" y="190">Export</text><text x="420" y="190">New subdomain</text><text x="590" y="190">Test in parallel</text><text x="760" y="190">Cut over</text><text x="925" y="190">Compare</text><text x="1090" y="190">Clean up</text>
</g>
<g font-size="13" fill="#626975" text-anchor="middle">
<text x="250" y="212">web + server</text><text x="250" y="230">containers</text>
<text x="420" y="212">DNS records + SSL</text><text x="420" y="230">e.g. sgtm2.yourstore.com</text>
<text x="590" y="212">preview, DebugView,</text><text x="590" y="230">Meta test events</text>
<text x="760" y="212">switch</text><text x="760" y="230">server_container_url</text>
<text x="925" y="212">tracked purchases</text><text x="925" y="230">vs real orders</text>
<text x="1090" y="212">cancel old plan,</text><text x="1090" y="230">remove extra snippet</text>
</g>
<g stroke="#dce0e3"><line x1="250" y1="262" x2="250" y2="440"/><line x1="420" y1="262" x2="420" y2="440"/><line x1="590" y1="262" x2="590" y2="440"/><line x1="760" y1="262" x2="760" y2="440" stroke="#5145cd" stroke-width="2" stroke-dasharray="7 5"/><line x1="925" y1="262" x2="925" y2="440"/><line x1="1090" y1="262" x2="1090" y2="440"/></g>
<rect x="40" y="276" width="1120" height="70" rx="14" fill="#fff" stroke="#dce0e3"/>
<text x="60" y="306" font-size="15" font-weight="700" fill="#101721">Old host</text><text x="60" y="328" font-size="13" fill="#626975">(e.g. Stape)</text>
<rect x="250" y="294" width="840" height="34" rx="8" fill="#aab4c5"/>
<text x="505" y="316" text-anchor="middle" font-size="14" font-weight="700" fill="#101721">Live, handling all real traffic</text>
<text x="925" y="316" text-anchor="middle" font-size="14" font-weight="700" fill="#101721">Standby, still running</text>
<rect x="40" y="360" width="1120" height="70" rx="14" fill="#fff" stroke="#dce0e3"/>
<text x="60" y="390" font-size="15" font-weight="700" fill="#101721">New host</text><text x="60" y="412" font-size="13" fill="#626975">second subdomain</text>
<rect x="420" y="378" width="340" height="34" rx="8" fill="#eceaff" stroke="#5145cd" stroke-dasharray="6 4"/>
<text x="590" y="400" text-anchor="middle" font-size="14" font-weight="700" fill="#5145cd">Testing only (staging or preview)</text>
<rect x="760" y="378" width="384" height="34" rx="8" fill="#5fa83a"/>
<text x="952" y="400" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Live</text>
<rect x="40" y="456" width="1120" height="52" rx="12" fill="#c5eb8c"/>
<text x="60" y="488" font-size="15" font-weight="600" fill="#1a3123">Your GTM containers belong to your Google account, not the host. The move is mostly DNS and configuration.</text>
<text x="48" y="536" font-size="13" fill="#9aa1ab">Illustrative timeline. Take as long as you need at each step; keep the old host until counts match for several days.</text>
</svg>
