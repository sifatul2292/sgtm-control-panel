</g>
<g font-size="15" fill="#101721">
<rect x="940" y="298" width="212" height="44" rx="10" fill="#fff" stroke="#dce0e3"/><text x="960" y="326">GA4</text>
<rect x="940" y="356" width="212" height="44" rx="10" fill="#fff" stroke="#dce0e3"/><text x="960" y="384">Meta CAPI</text>
<rect x="940" y="414" width="212" height="44" rx="10" fill="#fff" stroke="#dce0e3"/><text x="960" y="442">TikTok Events API</text>
<rect x="940" y="472" width="212" height="44" rx="10" fill="#fff" stroke="#dce0e3"/><text x="960" y="500">Google Ads</text>
</g>
<text x="48" y="574" font-size="13" fill="#626975">Only the destinations you select are included. Import each file into the matching container with Merge, then preview before publishing.</text>
