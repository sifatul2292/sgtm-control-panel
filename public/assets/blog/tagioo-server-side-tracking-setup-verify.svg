<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="Inter,-apple-system,Segoe UI,sans-serif" role="img" aria-labelledby="t d">
<title id="t">Verify a Tagioo setup in five checks</title>
<desc id="d">Five checks in order, from the browser to the ad platform. 1 Web GTM Preview: the purchase tag fires once on the right event. 2 Server GTM Preview: the GA4 client claims the request and tags return 2xx. 3 Tagioo Event Logs and Purchase Inspector: the order ID, value and destinations are listed. 4 Run tracking test: the GA4 server container is published and Meta CAPI credentials work. 5 Meta Test Events and GA4 Realtime: browser and server rows share the same event ID and Meta marks one as deduplicated; the purchase shows in GA4. If a check fails, stop and fix it before moving on.</desc>
<rect width="1200" height="600" fill="#f7f8fa"/>
<text x="48" y="56" font-size="22" font-weight="700" fill="#101721">Five checks before you trust the numbers</text>
<text x="48" y="84" font-size="15" fill="#626975">Work top to bottom with one test order. If a check fails, stop and fix it before moving on.</text>
<g font-size="13" font-weight="700" letter-spacing="1.5" fill="#626975"><text x="140" y="124">CHECK</text><text x="520" y="124">WHERE</text><text x="820" y="124">PASS WHEN…</text></g>
<g fill="#fff" stroke="#dce0e3">
<rect x="48" y="138" width="1104" height="72" rx="14"/><rect x="48" y="222" width="1104" height="72" rx="14"/><rect x="48" y="306" width="1104" height="72" rx="14"/><rect x="48" y="390" width="1104" height="72" rx="14"/><rect x="48" y="474" width="1104" height="72" rx="14"/>
</g>
<g font-size="17" font-weight="700" fill="#fff">
<circle cx="94" cy="174" r="20" fill="#5145cd"/><text x="94" y="180" text-anchor="middle">1</text>
<circle cx="94" cy="258" r="20" fill="#5145cd"/><text x="94" y="264" text-anchor="middle">2</text>
<circle cx="94" cy="342" r="20" fill="#395e33"/><text x="94" y="348" text-anchor="middle">3</text>
<circle cx="94" cy="426" r="20" fill="#395e33"/><text x="94" y="432" text-anchor="middle">4</text>
<circle cx="94" cy="510" r="20" fill="#101721"/><text x="94" y="516" text-anchor="middle">5</text>
</g>
<g font-size="17" font-weight="700" fill="#101721">
<text x="140" y="180">Browser fires once</text>
<text x="140" y="264">Server receives it</text>
<text x="140" y="348">Tagioo sees the order</text>
<text x="140" y="432">Credentials work</text>
<text x="140" y="516">Platforms accept it</text>
</g>
<g font-size="15" fill="#626975">
<text x="520" y="180">Web GTM Preview</text>
<text x="520" y="264">Server GTM Preview</text>
<text x="520" y="348">Event Logs, Purchase Inspector</text>
<text x="520" y="432">Run tracking test</text>
<text x="520" y="516">Meta Test Events, GA4 Realtime</text>
</g>
<g font-size="15" fill="#101721">
<text x="820" y="172">Purchase tag fires once, with</text><text x="820" y="194" fill="#626975">order ID, value, currency</text>
<text x="820" y="256">GA4 client claims the request,</text><text x="820" y="278" fill="#626975">tags return 2xx</text>
<text x="820" y="340">Order ID, value and destinations</text><text x="820" y="362" fill="#626975">match the test order</text>
<text x="820" y="424">GA4 server container published,</text><text x="820" y="446" fill="#626975">Meta CAPI credentials valid</text>
<text x="820" y="508">Browser + server share one event ID;</text><text x="820" y="530" fill="#626975">Meta shows one as deduplicated</text>
</g>
<text x="48" y="580" font-size="13" fill="#626975">Receipt by Tagioo alone doesn't prove a platform accepted the event. Always finish with check 5.</text>
</svg>
