<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" font-family="Inter,-apple-system,Segoe UI,sans-serif" role="img" aria-labelledby="t d">
<title id="t">One sale, four reports, four different rulebooks</title>
<desc id="d">Comparison of how a store, GA4, Google Ads and Meta Ads count the same sale. The store records every order and, on Shopify, credits the last non-direct click by default. GA4 counts purchase events it received, credits across all channels, and uses a 90-day default lookback for key events. Google Ads counts conversions after a Google Ads interaction, credits only Google Ads, uses a 30-day default click window and can include modeled conversions. Meta counts purchases after a Meta ad click or view, credits only Meta, uses 7-day click and 1-day view by default and can include modeled conversions.</desc>
<rect width="1200" height="660" fill="#f7f8fa"/>
<text x="48" y="56" font-size="22" font-weight="700" fill="#101721">Same sale, four rulebooks</text>
<text x="48" y="84" font-size="15" fill="#626975">Each system answers a different question, so their totals rarely match, even when tracking works.</text>
<g font-size="13" font-weight="700" letter-spacing="1.2" fill="#626975">
<text x="48" y="196">WHAT IT COUNTS</text>
<text x="48" y="306">WHO GETS CREDIT</text>
<text x="48" y="416">DEFAULT WINDOW</text>
<text x="48" y="526">COUNTS AD VIEWS?</text>
</g>
<rect x="212" y="110" width="226" height="490" rx="16" fill="#fff" stroke="#dce0e3"/>
<text x="232" y="146" font-size="19" font-weight="700" fill="#101721">Your store</text>
<text x="232" y="166" font-size="13" fill="#626975">Shopify, WooCommerce</text>
<text x="232" y="196" font-size="14" fill="#101721">Every order placed</text>
<text x="232" y="216" font-size="13" fill="#626975">your source of truth</text>
<text x="232" y="306" font-size="14" fill="#101721">Shopify default: last</text>
<text x="232" y="326" font-size="14" fill="#101721">non-direct click</text>
<text x="232" y="416" font-size="14" fill="#101721">Not applicable</text>
<text x="232" y="526" font-size="14" fill="#101721">No</text>
<rect x="452" y="110" width="226" height="490" rx="16" fill="#fff" stroke="#dce0e3"/>
<text x="472" y="146" font-size="19" font-weight="700" fill="#101721">GA4</text>
<text x="472" y="166" font-size="13" fill="#626975">analytics, all channels</text>
<text x="472" y="196" font-size="14" fill="#101721">Purchase events received</text>
<text x="472" y="216" font-size="13" fill="#626975">deduped by transaction_id</text>
<text x="472" y="306" font-size="14" fill="#101721">Any channel: paid,</text>
<text x="472" y="326" font-size="14" fill="#101721">organic, email, direct</text>
<text x="472" y="416" font-size="14" fill="#101721">90-day lookback</text>
<text x="472" y="436" font-size="13" fill="#626975">for key events</text>
<text x="472" y="526" font-size="14" fill="#101721">No ad views</text>
<rect x="692" y="110" width="226" height="490" rx="16" fill="#fff" stroke="#dce0e3"/>
<text x="712" y="146" font-size="19" font-weight="700" fill="#101721">Google Ads</text>
<text x="712" y="166" font-size="13" fill="#626975">ad platform</text>
<text x="712" y="196" font-size="14" fill="#101721">Conversions after a</text>
<text x="712" y="216" font-size="14" fill="#101721">Google Ads interaction</text>
<text x="712" y="236" font-size="13" fill="#626975">plus modeled conversions</text>
<text x="712" y="306" font-size="14" fill="#101721">Google Ads only</text>
<text x="712" y="416" font-size="14" fill="#101721">30-day click</text>
<text x="712" y="526" font-size="14" fill="#101721">Engaged views</text>
<text x="712" y="546" font-size="13" fill="#626975">on video ads</text>
<rect x="932" y="110" width="220" height="490" rx="16" fill="#fff" stroke="#dce0e3"/>
<text x="952" y="146" font-size="19" font-weight="700" fill="#101721">Meta Ads</text>
<text x="952" y="166" font-size="13" fill="#626975">ad platform</text>
<text x="952" y="196" font-size="14" fill="#101721">Purchases after a</text>
<text x="952" y="216" font-size="14" fill="#101721">Meta ad click or view</text>
<text x="952" y="236" font-size="13" fill="#626975">plus modeled conversions</text>
<text x="952" y="306" font-size="14" fill="#101721">Meta only</text>
<text x="952" y="416" font-size="14" fill="#101721">7-day click,</text>
<text x="952" y="436" font-size="14" fill="#101721">1-day view*</text>
<text x="952" y="526" font-size="14" fill="#101721">Yes, by default</text>
<line x1="212" y1="256" x2="1152" y2="256" stroke="#eef0f2" stroke-width="2"/>
<line x1="212" y1="366" x2="1152" y2="366" stroke="#eef0f2" stroke-width="2"/>
<line x1="212" y1="476" x2="1152" y2="476" stroke="#eef0f2" stroke-width="2"/>
<text x="48" y="628" font-size="13" fill="#626975">*Meta also added a 1-day engage-through window in 2026. All defaults can be changed in each platform's settings.</text>
<text x="48" y="648" font-size="13" fill="#9aa1ab">Sources: Google Analytics and Google Ads Help; Shopify blog on marketing attribution; Jon Loomer on Meta attribution (2026).</text>
</svg>
