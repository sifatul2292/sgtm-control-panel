<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="Inter,-apple-system,Segoe UI,sans-serif" role="img" aria-labelledby="t d">
<title id="t">How to measure your own tracking gap</title>
<desc id="d">Export backend orders with order IDs and GA4 purchases with transaction IDs for the same closed period, then join them on order ID. Orders in both lists are matched and give your match rate. Orders only in the backend are missing from GA4; break them down by browser, device and payment method. Transaction IDs only in GA4 usually point to test or cancelled orders, or a transaction ID that is not the order number. Match rate equals matched orders divided by eligible backend orders.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#626975"/></marker>
</defs>
<rect width="1200" height="600" fill="#f7f8fa"/>
<text x="48" y="56" font-size="22" font-weight="700" fill="#101721">How to measure your own tracking gap</text>
<text x="48" y="84" font-size="15" fill="#626975">Same closed period (14+ days), same timezone, test and phone orders removed.</text>
<rect x="48" y="124" width="300" height="104" rx="14" fill="#fff" stroke="#dce0e3"/>
<text x="72" y="162" font-size="18" font-weight="700" fill="#101721">Backend orders</text>
<text x="72" y="188" font-size="14" fill="#626975">WooCommerce, Shopify or CRM</text>
<text x="72" y="210" font-size="14" fill="#626975">order ID · date · total</text>
<rect x="48" y="252" width="300" height="104" rx="14" fill="#fff" stroke="#dce0e3"/>
<text x="72" y="290" font-size="18" font-weight="700" fill="#101721">GA4 purchases</text>
<text x="72" y="316" font-size="14" fill="#626975">Exploration: Transaction ID</text>
<text x="72" y="338" font-size="14" fill="#626975">Purchases · Purchase revenue</text>
<path d="M352 176 C 400 176 400 240 444 240" stroke="#626975" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
<path d="M352 304 C 400 304 400 240 444 240" stroke="#626975" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
<rect x="450" y="190" width="220" height="100" rx="16" fill="#5145cd"/>
<text x="560" y="232" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">Join on</text>
<text x="560" y="258" text-anchor="middle" font-size="15" fill="#fff">order ID = transaction ID</text>
<line x1="674" y1="220" x2="724" y2="160" stroke="#626975" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="674" y1="240" x2="724" y2="280" stroke="#626975" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="674" y1="262" x2="724" y2="400" stroke="#626975" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="730" y="112" width="422" height="96" rx="14" fill="#c5eb8c" stroke="#a9d36b"/>
<text x="754" y="148" font-size="17" font-weight="700" fill="#101721">In both lists: matched</text>
<text x="754" y="174" font-size="14" fill="#395e33">Counted correctly. This is the top of</text>
<text x="754" y="194" font-size="14" fill="#395e33">your match rate.</text>
<rect x="730" y="232" width="422" height="96" rx="14" fill="#fff" stroke="#dce0e3"/>
<text x="754" y="268" font-size="17" font-weight="700" fill="#b4232c">Backend only: missing in GA4</text>
<text x="754" y="294" font-size="14" fill="#626975">Break down by browser, device and payment</text>
<text x="754" y="314" font-size="14" fill="#626975">method to find the cause.</text>
<rect x="730" y="352" width="422" height="96" rx="14" fill="#fff" stroke="#dce0e3"/>
<text x="754" y="388" font-size="17" font-weight="700" fill="#a45f0b">GA4 only: no matching order</text>
<text x="754" y="414" font-size="14" fill="#626975">Usually test or cancelled orders, or a</text>
<text x="754" y="434" font-size="14" fill="#626975">transaction ID that isn't your order number.</text>
<rect x="48" y="480" width="1104" height="64" rx="14" fill="#fff" stroke="#dce0e3"/>
<text x="72" y="519" font-size="17" font-weight="700" fill="#101721">Match rate = matched orders ÷ eligible backend orders</text>
<text x="620" y="519" font-size="15" fill="#626975">Example: 410 ÷ 500 = 82% match, 18% gap</text>
<text x="48" y="578" font-size="13" fill="#9aa1ab">Example figures are illustrative. Repeat the same comparison before and after every tracking change.</text>
</svg>
